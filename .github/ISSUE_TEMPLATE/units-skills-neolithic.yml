name: Навыки юнита Неолита
description: Задача на описание навыков юнита эпохи Неолита
title: '[Неолит] Навыки юнита'
type: Units
projects: ['Phoenix-Games-Revolution/7']
body:
  - type: dropdown
    id: unit-name
    attributes:
      label: Название юнита
      description: Выбери юнита для описания его навыков
      options:
        - Воин
        - Земледелец
        - Скотовод
        - Жрец
        - Строитель
        - Лучник
        - Пращник
        - Разведчик
        - Ремесленник
    validations:
      required: true
  - type: dropdown
    id: skill-tree-type
    attributes:
      label: Тип древа навыков
      description: Укажи структуру древа навыков
      options:
        - Только пассивные навыки
        - Только активные навыки
        - Смешанные навыки
    validations:
      required: true
