name: Навыки юнита Бронзового века
description: Задача на описание навыков юнита эпохи Бронзового века
title: '[Бронзовый век] Навыки юнита'
type: Units
projects: ['Phoenix-Games-Revolution/7']
body:
  - type: dropdown
    id: unit-name
    attributes:
      label: Название юнита
      description: Выбери юнита для описания его навыков
      options:
        - Бронзовый мечник
        - Лучник
        - Пращник
        - Колесничий лучник
        - Колесница
        - Всадник
        - Копейщик
        - Строитель
        - Торговец
        - Жрец
        - Разведчик
        - Осадный инженер
    validations:
      required: true
  - type: dropdown
    id: skill-tree-type
    attributes:
      label: Тип древа навыков
      description: Укажи структуру древа навыков
      options:
        - Только пассивные навыки
        - Только активные навыки
        - Смешанные навыки
    validations:
      required: true
