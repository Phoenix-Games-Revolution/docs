name: Навыки юнита Раннего Железного века
description: Задача на описание навыков юнита эпохи Раннего Железного века
title: '[Ранний железный век] Навыки юнита'
type: Units
projects: ['Phoenix-Games-Revolution/7']
body:
  - type: dropdown
    id: unit-name
    attributes:
      label: Название юнита
      description: Выбери юнита для описания его навыков
      options:
        - Железный мечник
        - Тяжёлый копейщик
        - Ранний арбалетчик
        - Лучник
        - Пращник
        - Всадник
        - Боевой слон
        - Боевая колесница
        - Осадный инженер
        - Верховный жрец
        - Инженер
        - Разведчик
        - Торговец
    validations:
      required: true

  - type: dropdown
    id: skill-tree-type
    attributes:
      label: Тип древа навыков
      description: Укажи структуру древа навыков
      options:
        - Только пассивные навыки
        - Только активные навыки
        - Смешанные навыки
    validations:
      required: true
