name: Прогрессия юнита Неолита
description: Задача на описание прогрессии юнита эпохи Неолита
title: '[Неолит] Прогрессия юнита'
type: Units
projects: ['Phoenix-Games-Revolution/7']
body:
  - type: dropdown
    id: unit-name
    attributes:
      label: Название юнита
      description: Выбери юнита для описания его прогрессии
      options:
        - Воин
        - Земледелец
        - Скотовод
        - Жрец
        - Строитель
        - Лучник
        - Пращник
        - Разведчик
        - Ремесленник
    validations:
      required: true
  - type: dropdown
    id: progression-type
    attributes:
      label: Тип прогрессии
      description: Формат древа развития юнита
      options:
        - Линейное (без ветвлений)
        - С ветвлениями
        - С выбором специализации
    validations:
      required: true
