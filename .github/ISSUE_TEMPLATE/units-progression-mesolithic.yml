name: Прогрессия юнита Мезолита
description: Задача на описание прогрессии юнита эпохи Мезолита
title: '[Мезолит] Прогрессия юнита'
type: Units
projects: ['Phoenix-Games-Revolution/7']
body:
  - type: dropdown
    id: unit-name
    attributes:
      label: Название юнита
      description: Выбери юнита для описания его прогрессии
      options:
        - Охотник
        - Старший собиратель
        - Рыбак
        - Хранитель огня
        - Шаман
        - Разведчик
        - Пращник
        - Погонщик вьючных животных
    validations:
      required: true
  - type: dropdown
    id: progression-type
    attributes:
      label: Тип прогрессии
      description: Формат древа развития юнита
      options:
        - Линейное (без ветвлений)
        - С ветвлениями
        - С выбором специализации
    validations:
      required: true
