name: Навыки юнита Энеолита
description: Задача на описание навыков юнита эпохи Энеолита
title: '[Энеолит] Навыки юнита'
type: Units
projects: ['Phoenix-Games-Revolution/7']
body:
  - type: dropdown
    id: unit-name
    attributes:
      label: Название юнита
      description: Выбери юнита для описания его навыков
      options:
        - Копейщик
        - Лучник
        - Пращник
        - Шахтёр
        - Кузнец
        - Жрец
        - Разведчик
        - Возница
        - Охотник
    validations:
      required: true
  - type: dropdown
    id: skill-tree-type
    attributes:
      label: Тип древа навыков
      description: Укажи структуру древа навыков
      options:
        - Только пассивные навыки
        - Только активные навыки
        - Смешанные навыки
    validations:
      required: true
