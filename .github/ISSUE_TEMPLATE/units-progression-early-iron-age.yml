name: Прогрессия юнита Раннего Железного века
description: Задача на описание прогрессии юнита эпохи Раннего Железного века
title: '[Ранний железный век] Прогрессия юнита'
type: Units
projects: ['Phoenix-Games-Revolution/7']
body:
  - type: dropdown
    id: unit-name
    attributes:
      label: Название юнита
      description: Выбери юнита для описания его прогрессии
      options:
        - Железный мечник
        - Тяжёлый копейщик
        - Ранний арбалетчик
        - Лучник
        - Пращник
        - Всадник
        - Боевой слон
        - Боевая колесница
        - Осадный инженер
        - Верховный жрец
        - Инженер
        - Разведчик
        - Торговец
    validations:
      required: true
  - type: dropdown
    id: progression-type
    attributes:
      label: Тип прогрессии
      description: Формат древа развития юнита
      options:
        - Линейное (без ветвлений)
        - С ветвлениями
        - С выбором специализации
    validations:
      required: true
