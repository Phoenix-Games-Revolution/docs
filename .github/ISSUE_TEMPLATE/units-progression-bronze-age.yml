name: Прогрессия юнита Бронзового века
description: Задача на описание прогрессии юнита эпохи Бронзового века
title: '[Бронзовый век] Прогрессия юнита'
type: Units
projects: ['Phoenix-Games-Revolution/7']
body:
  - type: dropdown
    id: unit-name
    attributes:
      label: Название юнита
      description: Выбери юнита для описания его прогрессии
      options:
        - Бронзовый мечник
        - Лучник
        - Пращник
        - Колесничий лучник
        - Колесница
        - Всадник
        - Копейщик
        - Строитель
        - Торговец
        - Жрец
        - Разведчик
        - Осадный инженер
    validations:
      required: true
  - type: dropdown
    id: progression-type
    attributes:
      label: Тип прогрессии
      description: Формат древа развития юнита
      options:
        - Линейное (без ветвлений)
        - С ветвлениями
        - С выбором специализации
    validations:
      required: true
