name: Docs
description: Task for creating or changing a documentation section
title: '[Docs] '
type: Docs
projects: ['Phoenix-Games-Revolution/5']
body:
  - type: textarea
    id: where
    attributes:
      label: Where do we change?
      description: Specify the section, directory, or document that will be updated
      placeholder: For example, game-design/canon or docs/gdd/canon
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What do we describe?
      description: Briefly describe the meaning of the document or the change set
      placeholder: For example, canonical game model or combat unit lifecycle
    validations:
      required: true

  - type: textarea
    id: structure
    attributes:
      label: What should the structure look like?
      description: Describe the expected sections, pages, or order of presentation
      placeholder: For example, a dedicated Canon section with five pages and a sidebars.ts update
    validations:
      required: true
